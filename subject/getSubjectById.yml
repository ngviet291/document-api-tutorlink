runtime:
  scripts:
    - type: tests
      code: |-
        test("lấy chi tiết trả 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("id khớp subjectId", function () {
          expect(res.body.data.id).to.equal(bru.getEnvVar("subjectId"));
        });

settings:
