info:
  name: getFeeConfigs
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/v1/payments/fee-configs"
  params:
    - name: limit
      value: "10"
      type: query
      disabled: true
    - name: cursor
      value: ""
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200 && res.body.data.content.length > 0) {
          bru.setEnvVar("feeConfigId", res.body.data.content[0].id);
        }
    - type: tests
      code: |-
        test("danh sách config trả 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("code PAYMENT_200", function () {
          expect(res.body.code).to.equal("PAYMENT_200");
        });
        test("có cursor response", function () {
          const data = res.body.data;
          expect(data).to.have.property("content");
          expect(data).to.have.property("hasNext");
          expect(data.content).to.be.an("array");
        });
        test("config có đầy đủ field", function () {
          if (res.body.data.content.length > 0) {
            const config = res.body.data.content[0];
            expect(config.id).to.be.a("string");
            expect(config.feePercentage).to.be.a("number");
            expect(config.fixedFee).to.be.a("number");
            expect(config.effectiveFrom).to.be.a("string");
            expect(config.createdByAdminId).to.be.a("string");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
