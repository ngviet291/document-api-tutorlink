info:
  name: register-tutor
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register/tutor"
  body:
    type: json
    data: |-
      {
        "fullname": "Nguyễn Văn Tutor",
        "email": "tutor{{uniq}}@tutorlink.com",
        "password": "Tutor@123",
        "phone": "0912345678",
        "gender": "MALE",
        "dateOfBirth": "1998-03-20",
        "address": "Quận 1, TP.HCM",
        "experienceYears": 5,
        "education": "Đại học Bách Khoa TP.HCM",
        "subjectId": "{{subjectId}}"
      }
  auth: none

docs:
  content: subjectId là bắt buộc. Chạy subject/createSubject trước (trước deleteSubject) để biến subjectId có giá trị.

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("uniq", Date.now());
    - type: tests
      code: |-
        test("đăng ký tutor trả 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
