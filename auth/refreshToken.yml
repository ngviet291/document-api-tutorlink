info:
  name: refreshToken
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/refresh-token"
  body:
    type: json
    data: |-
      {
        "refreshToken": "{{refreshToken}}"
      }
  auth: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("accessToken", res.body.data.accessToken);
          bru.setEnvVar("refreshToken", res.body.data.refreshToken);
        }
    - type: tests
      code: |-
        test("refresh token trả 200", function () {
          expect(res.getStatus()).to.equal(200);
          expect(res.body.data.accessToken).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
