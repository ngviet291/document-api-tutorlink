info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@gmail.com",
        "password": "Admin@123"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("accessToken", res.body.data.accessToken);
          bru.setEnvVar("refreshToken", res.body.data.refreshToken);
        }
    - type: tests
      code: |-
        test("login admin trả 200", function () {
          expect(res.getStatus()).to.equal(200);
        });
        test("có accessToken và refreshToken", function () {
          expect(res.body.data.accessToken).to.be.a("string").and.not.empty;
          expect(res.body.data.refreshToken).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
