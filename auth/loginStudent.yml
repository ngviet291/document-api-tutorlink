info:
  name: loginStudent
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      { 
        "email": "student@gmail.com", 
        "password": "Student@123" 
      }

runtime:
  scripts:
    - type: after-response
      code: if (res.getStatus() === 200) bru.setEnvVar("studentToken", res.body.data.accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
