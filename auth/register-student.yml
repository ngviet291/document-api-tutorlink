info:
  name: register-student
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/register/student"
  body:
    type: json
    data: |-
      {
        "fullname": "Nguyễn Văn A",
        "email": "student{{uniq}}@tutorlink.com",
        "password": "Student@123",
        "phone": "0901234567",
        "gender": "MALE",
        "dateOfBirth": "2005-05-15",
        "address": "Thủ Đức, TP.HCM",
        "grade": "12",
        "school": "THPT Nguyễn Hữu Cầu",
        "learningGoal": "Cải thiện kỹ năng lập trình"
      }
  auth: none

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("uniq", Date.now());
    - type: tests
      code: |-
        test("đăng ký student trả 201", function () {
          expect(res.getStatus()).to.equal(201);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
