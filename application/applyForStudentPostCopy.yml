info:
  name: applyForStudentPostCopy
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/applications"
  body:
    type: json
    data: |-
      { 
        "postId": "{{postId}}", 
        "message": "Em muốn dạy bài này." 
      }
  auth:
    type: bearer
    token: "{{tutorToken}}"

runtime:
  scripts:
    - type: after-response
      code: if (res.getStatus() < 300) bru.setEnvVar("applicationId", res.body.data.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
